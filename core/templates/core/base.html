{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catálogo{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'core/favicon.svg' %}">
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --primary: #264653;
      --accent: #2a9d8f;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--primary);
      padding: 1rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    nav a:hover {
      background: rgba(255,255,255,0.12);
    }

    main {
      max-width: 980px;
      margin: 2rem auto;
      padding: 0 1rem 2rem;
    }

    h1 {
      color: var(--primary);
      margin-bottom: 1rem;
    }

    form {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    form input,
    form select,
    form button {
      font: inherit;
      padding: 0.7rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    form button {
      background: var(--accent);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
    }

    a {
      color: var(--primary);
    }

    p {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'lista_produtos' %}">Catálogo</a>
      <a href="{% url 'criar_produto' %}">Novo produto</a>
      <a href="{% url 'categorias' %}">Categorias</a>
      <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
